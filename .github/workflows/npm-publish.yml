# Publishes @balansse/homebridge-vivint to npm using npm Trusted Publishing (OIDC).
# No long-lived NPM token is used; provenance attestations are generated automatically.
# Requires a trusted publisher configured on npmjs.com for this repo/workflow/environment.
# Releases are *staged*: approve them at npmjs.com (or `npm stage approve <id>`) with 2FA to go live.
#
# Branches: `latest` releases run from `master` only; `beta` releases run from the `beta` branch only.
# Beta releases: on the `beta` branch, set a prerelease version in package.json (e.g. 1.13.0-beta.0)
# and run this workflow from `beta` with tag "beta". Users only get it if they opt in
# (@beta / "Install Alternate Version"); `latest` and Homebridge's update prompt are unaffected.

name: Node.js Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag: "latest" for normal releases, "beta" for prerelease versions like 1.13.0-beta.0'
        type: choice
        options: [latest, beta]
        default: latest

permissions:
  contents: read

jobs:
  # Fail fast if the version and tag don't match, so a beta can never land on `latest` (or vice versa)
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check branch, version, tag and registry
        env:
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            latest) EXPECTED_BRANCH=master ;;
            beta)   EXPECTED_BRANCH=beta ;;
            *)      echo "::error::Unknown tag '$TAG'"; exit 1 ;;
          esac
          if [ "$BRANCH" != "$EXPECTED_BRANCH" ]; then
            echo "::error::'$TAG' releases must be run from the '$EXPECTED_BRANCH' branch (this run is on '$BRANCH')."
            exit 1
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VERSION with tag '$TAG'"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          if [ "$TAG" = "latest" ] && [ "$PRERELEASE" = "true" ]; then
            echo "::error::$VERSION is a prerelease version; run the workflow with tag 'beta'."
            exit 1
          fi
          if [ "$TAG" != "latest" ] && [ "$PRERELEASE" = "false" ]; then
            echo "::error::Tag '$TAG' needs a prerelease version (e.g. ${VERSION}-beta.0); '$VERSION' would look like a stable release."
            exit 1
          fi
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::error::$NAME@$VERSION is already published on npm; bump the version first."
            exit 1
          fi
          {
            echo "### Releasing \`$NAME@$VERSION\` as \`$TAG\`"
            echo "After this run, approve the staged version on npmjs.com (2FA)."
            if [ "$TAG" != "latest" ]; then
              echo ""
              echo "Testers install it with \`npm i $NAME@$TAG\` or via *Install Alternate Version* in the Homebridge UI."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Full CI (lint, unit, config UI, packed plugin in Homebridge 1.x/2.x) must pass before publishing
  test:
    uses: ./.github/workflows/ci.yml

  publish-npm:
    needs: [check-version, test]
    # Defense in depth: repeats check-version's branch rule (the prod environment also restricts branches)
    if: (inputs.tag == 'latest' && github.ref == 'refs/heads/master') || (inputs.tag == 'beta' && github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm --version
      # npm ci runs the "prepare" script, which builds the config UI into dist/
      - run: npm ci
      # The trusted publisher only allows `npm stage publish`; a maintainer approves with 2FA
      - run: npm stage publish --access public --tag "$TAG"
        env:
          TAG: ${{ inputs.tag }}
