# Lint, unit tests, config UI build, and end-to-end tests of the packed plugin inside real
# Homebridge 1.x and 2.x (Vivint + PubNub mocked). Also called by the publish workflow.

name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Lint & unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

  ui:
    name: Config UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/homebridge-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lib/homebridge-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    name: Pack plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # npm ci runs "prepare", which builds the config UI into dist/
      - run: npm ci
      - run: mkdir -p pack && npm pack --pack-destination pack
      - run: tar tzf pack/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-tarball
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Homebridge ${{ matrix.homebridge }}.x on Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        homebridge: ['1', '2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-tarball
          path: ${{ runner.temp }}/pack
      - name: Run integration tests
        env:
          HOMEBRIDGE_VERSION: ${{ matrix.homebridge }}
        run: PLUGIN_TARBALL="$(ls "$RUNNER_TEMP"/pack/*.tgz)" npm run test:integration
